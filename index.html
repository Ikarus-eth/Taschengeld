<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Challenges">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Challenges</title>
<style>
:root{
  --paper:#F3F5F0; --card:#FFFFFF; --ink:#1B2118; --ink-soft:#5C665A; --line:#D9DED6;
  --gold:#B07D18; --gold-soft:#F6EBD2;
  --juna:#7A3E9D; --juna-soft:#EFE5F6; --artus:#1F7A5C; --artus-soft:#DFF0E8;
  --warn:#A33B2A; --accent:var(--juna); --accent-soft:var(--juna-soft); --r:14px;
}
body.artus{--accent:var(--artus);--accent-soft:var(--artus-soft);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:17px;line-height:1.45;padding-bottom:96px;-webkit-text-size-adjust:100%;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;}
.num{font-variant-numeric:tabular-nums;}
header{padding:14px 0 6px;}
.kidtabs{display:flex;gap:8px;}
.kidtab{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:12px 10px;font-size:19px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.kidtab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
.hero{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;}
.hero h1{margin:0 0 2px;font-size:15px;font-weight:600;color:var(--ink-soft);}
.big{font-size:46px;font-weight:700;line-height:1.05;letter-spacing:-.02em;}
.bar{height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--line);
  overflow:hidden;display:flex;margin:14px 0 10px;}
.bar i{display:block;height:100%;}
.bar .b1{background:var(--gold);} .bar .b2{background:var(--accent);opacity:.32;}
.legend{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);gap:8px;}
.legend b{display:block;color:var(--ink);font-size:17px;font-weight:700;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px;}
section{margin-top:22px;}
h2{font-size:15px;font-weight:700;color:var(--ink-soft);margin:0 0 10px;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
.row:first-child{border-top:0;}
.row .grow{flex:1;min-width:0;}
.sub{font-size:14px;color:var(--ink-soft);}
.money{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.muted{color:var(--ink-soft);}
button{font-family:inherit;font-size:17px;cursor:pointer;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;
  padding:12px 18px;font-weight:600;min-height:48px;}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.small{padding:8px 14px;min-height:40px;font-size:15px;}
.btn.tiny{padding:6px 12px;min-height:36px;font-size:14px;}
.btn:disabled{opacity:.4;cursor:default;}
.today{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;text-align:center;}
.stamps{display:flex;gap:10px;}
.stamp{flex:1;min-height:118px;border-radius:16px;border:2.5px dashed var(--line);background:var(--paper);
  color:var(--ink-soft);font-size:19px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:8px;}
.stamp.done{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
.stamp.bonus.done{border-color:var(--gold);background:var(--gold-soft);}
.stamp .mins{font-size:14px;font-weight:600;color:var(--ink-soft);}
.weekdots{display:flex;justify-content:space-between;gap:6px;margin-top:14px;}
.weeklabel{font-size:12px;font-weight:600;color:var(--ink-soft);margin:14px 0 4px;text-align:left;}
.wd{flex:1;text-align:center;font-size:13px;color:var(--ink-soft);font-family:inherit;
  background:none;border:0;padding:0;cursor:pointer;}
.wd .dnum{display:block;font-size:11px;opacity:.7;}
.wd.lock{opacity:.3;cursor:default;}
.wd i{display:block;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);margin-bottom:4px;}
.wd.on i{background:var(--accent);border-color:var(--accent);}
.wd.plus i{background:var(--gold);border-color:var(--gold);}
.wd.today i{border-color:var(--ink);border-width:2.5px;}
.stairs{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px;}
.st{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
.st i{display:block;border-radius:4px 4px 0 0;border:1.5px solid var(--line);border-bottom:0;background:var(--paper);}
.st.won i{background:var(--gold);border-color:var(--gold);}
.st.now i{border-color:var(--ink);border-width:2px;border-bottom:0;}
.st.miss i{background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 3px,#E6E2D6 3px,#E6E2D6 6px);}
.stairlabels{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:6px;}
.check{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--paper);flex:none;
  padding:0;font-family:inherit;}
.check.on{background:var(--accent);border-color:var(--accent);position:relative;}
.check.on::after{content:"";position:absolute;left:11px;top:5px;width:8px;height:16px;
  border:solid #fff;border-width:0 3px 3px 0;transform:rotate(42deg);}
.check[disabled]{opacity:.45;}
.holding{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);}
.holding:first-child{border-top:0;}
.mini{height:6px;border-radius:3px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin-top:6px;}
.mini i{display:block;height:100%;background:var(--gold);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.choice{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;
  text-align:center;font-weight:600;font-size:15px;color:var(--ink);}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);}
.choice[disabled]{opacity:.45;}
.choice .pct{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:2px;}
.choice .risk{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:3px;letter-spacing:.06em;}
.baskets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chipco{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--paper);
  border:1px solid var(--line);color:var(--ink-soft);}
.chipco b{color:var(--ink);font-weight:600;}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
  border-top:1.5px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);}
nav button{flex:1;background:none;border:0;padding:11px 4px 13px;font-size:12px;font-weight:600;
  color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button[aria-selected="true"]{color:var(--accent);}
nav .ico{font-size:21px;line-height:1;}
dialog{border:0;border-radius:18px;padding:0;max-width:460px;width:calc(100% - 28px);
  box-shadow:0 12px 44px rgba(27,33,24,.24);color:var(--ink);}
dialog::backdrop{background:rgba(27,33,24,.42);}
.dlg{padding:20px;max-height:78vh;overflow:auto;}
.dlg h3{margin:0 0 4px;font-size:21px;}
.dlg h4{margin:18px 0 2px;font-size:15px;font-weight:700;}
.dlg p{margin:8px 0;font-size:16px;}
label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;}
input,select,textarea{width:100%;font-family:inherit;font-size:17px;padding:12px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);}
.dlgbtns{display:flex;gap:8px;margin-top:18px;}
.dlgbtns .btn{flex:1;}
.foot{font-size:13px;color:var(--ink-soft);text-align:center;margin:26px 0 8px;}
.warnbox{background:var(--gold-soft);border:1.5px solid #E8D6AE;border-radius:12px;padding:12px;font-size:14px;margin-top:12px;}
.notebox{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin-top:12px;}
table{width:100%;border-collapse:collapse;font-size:15px;}
td{padding:7px 0;border-top:1px solid var(--line);}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
tr:first-child td{border-top:0;}
.feedlog{font-size:13px;color:var(--ink-soft);margin-top:10px;white-space:pre-line;}
@media (prefers-reduced-motion:no-preference){
  .stamp,.check,.wd i,.st i{transition:background-color .18s ease,border-color .18s ease;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kidtabs" role="tablist">
      <button class="kidtab" role="tab" id="tabJuna" onclick="setKid('juna')">Juna</button>
      <button class="kidtab" role="tab" id="tabArtus" onclick="setKid('artus')">Artus</button>
    </div>
  </header>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>
<nav role="tablist">
  <button role="tab" data-v="today" onclick="setView('today')"><span class="ico">📖</span>Today</button>
  <button role="tab" data-v="goals" onclick="setView('goals')"><span class="ico">🎯</span>Goals</button>
  <button role="tab" data-v="money" onclick="setView('money')"><span class="ico">💰</span>Money</button>
  <button role="tab" data-v="saving" onclick="setView('saving')"><span class="ico">📈</span>Saving</button>
  <button role="tab" data-v="parents" onclick="askPin()"><span class="ico">🔑</span>Parents</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
"use strict";
const DAY=86400000, KEY="challenges_v2", FEEDKEY="challenges_feed";
const AUTO_MS=6*3600*1000, RETRY_MS=30*60*1000;

const RATES={
  juna:[2,2,2,2, 4,4,4,4, 5,5,5,5, 6,6,6,6, 8,8,8,8],
  artus:[1,1,1, 1.5,1.5,1.5, 2,2,2,2]
};
const BOOKS={juna:[4,7,10,14], artus:[2,2,2,2,2]};
const COMPANIES=["Alphabet","Microsoft","SpaceX","NVIDIA","Apple","Amazon","TSMC","Meta","Tesla"];
const TICKER={Alphabet:"GOOGL",Microsoft:"MSFT",SpaceX:"SPCX",NVIDIA:"NVDA",Apple:"AAPL",
  Amazon:"AMZN",TSMC:"TSM",Meta:"META",Tesla:"TSLA"};
const INSTR={
  btc:{name:"Bitcoin",icon:"₿",risk:3,
    short:"Digital money. No company behind it.",
    why:"Bitcoin has grown a lot over the years, and when it moves up it can move up fast.",
    care:"It is the wildest of the three. Losing a third of its value in a few months has happened many times, and it can happen again."},
  etf:{name:"World fund",icon:"🌍",risk:1,
    short:"A tiny slice of about 1,500 big companies all over the world.",
    why:"When one company has a bad year, the other 1,499 carry you. It moves up more calmly and more often than it moves down.",
    care:"It grows slowly. In a bad year the whole world market can still drop by a fifth."},
  basket:{name:"Future basket",icon:"🚀",risk:2,
    short:"Nine companies you already know, counted equally.",
    why:"These companies build a lot of the things people want next. If they do well, the basket does better than the world fund.",
    care:"Nine companies is not many. If two of them stumble badly, you feel it."}
};

function slot(sym){ return {px:null, base:null, sym:sym||null}; }
function fresh(){
  return {
    v:3, fx:17500, fxDate:null, pin:"1234",
    feed:{sheet:"", updated:null, tried:null, log:"", auto:true},
    prices:{ btc:slot("BTC"), etf:slot("URTH"),
      basket:Object.fromEntries(COMPANIES.map(c=>[c, slot(TICKER[c])])) },
    kids:{
      juna:{ name:"Juna", start:"2026-08-31", weeks:20, minDays:5, minutes:20,
        bonusMinutes:0, bonusDays:0, bonusEur:0,
        allowance:20, allowanceEvery:"month",
        bookMin:"200 pages or more, your own pick", wordRate:0.10, wordCap:1,
        milestones:[
          {id:"h3",label:"Handstand for 3 seconds (3x in one day)",eur:20,done:null},
          {id:"h10",label:"Handstand for 10 seconds",eur:80,done:null},
          {id:"hw",label:"10 steps on your hands",eur:50,done:null}],
        days:{}, books:[], words:{}, spend:[], deposits:[], payouts:[], extras:[] },
      artus:{ name:"Artus", start:"2026-08-31", weeks:10, minDays:5, minutes:10,
        bonusMinutes:15, bonusDays:4, bonusEur:1,
        allowance:2, allowanceEvery:"week",
        bookMin:"An early reader, one every two weeks", wordRate:0, wordCap:0,
        milestones:[],
        days:{}, books:[], words:{}, spend:[], deposits:[], payouts:[], extras:[] }
    }
  };
}

/* labels that were German before v3, swapped only when still the old default */
const DE2EN={
  "Handstand 3 Sekunden (3x an einem Tag)":"Handstand for 3 seconds (3x in one day)",
  "Handstand 10 Sekunden":"Handstand for 10 seconds",
  "10 Schritte auf den Händen":"10 steps on your hands",
  "ab 200 Seiten, selbst ausgesucht":"200 pages or more, your own pick",
  "Erstlesebuch, alle 2 Wochen eins":"An early reader, one every two weeks"
};

let S=load(), KID="juna", VIEW="today", CUR="EUR", BUY="basket";

function load(){
  try{
    const raw=localStorage.getItem(KEY)||localStorage.getItem("challenges_v1");
    if(!raw){ const o=fresh(); o.feed.sheet=localStorage.getItem(FEEDKEY)||""; return o; }
    const p=JSON.parse(raw), f=fresh(), out=Object.assign({},f,p);
    out.feed=Object.assign({},f.feed,p.feed||{});
    /* the sheet link also lives in its own key, so a partial import or a bad
       merge can never silently unlink the price feed */
    const mirror=localStorage.getItem(FEEDKEY)||"";
    if(!out.feed.sheet && mirror) out.feed.sheet=mirror;
    out.prices=Object.assign({},f.prices);
    for(const k of ["btc","etf"]) if(p.prices&&typeof p.prices[k]==="object"&&p.prices[k].px!==undefined) out.prices[k]=p.prices[k];
    out.prices.basket=Object.assign({},f.prices.basket);
    if(p.prices&&p.prices.basket) for(const c of COMPANIES){
      const v=p.prices.basket[c];
      if(v&&typeof v==="object"&&v.px!==undefined) out.prices.basket[c]=Object.assign({},f.prices.basket[c],v);
    }
    out.kids={};
    for(const k of ["juna","artus"]){
      const kid=Object.assign({},f.kids[k],(p.kids||{})[k]||{});
      const d={};
      for(const key in (kid.days||{})){ const val=kid.days[key]; d[key]= val===true? kid.minutes : Number(val)||0; }
      kid.days=d;
      if(!Array.isArray(kid.extras)) kid.extras=[];
      if(!Array.isArray(kid.deposits)) kid.deposits=[];
      for(const dep of kid.deposits){
        if(dep.px===undefined) dep.px=dep.idx||100;
        if(dep.id===undefined) dep.id="d"+Math.random().toString(36).slice(2);
      }
      if(DE2EN[kid.bookMin]) kid.bookMin=DE2EN[kid.bookMin];
      kid.milestones=(kid.milestones||[]).map(m=>DE2EN[m.label]? Object.assign({},m,{label:DE2EN[m.label]}) : m);
      out.kids[k]=kid;
    }
    out.v=3;
    return out;
  }catch(e){ return fresh(); }
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    localStorage.setItem(FEEDKEY,S.feed.sheet||"");
  }catch(e){ alert("Could not save."); }
}

const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
function monday(d){const x=new Date(d);x.setHours(12,0,0,0);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);return x;}
function today(){const x=new Date();x.setHours(12,0,0,0);return x;}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const K=k=>S.kids[k||KID];
function weekIndex(k,d){ return Math.floor((monday(d)-monday(new Date(K(k).start+"T12:00:00")))/(7*DAY)); }
function dshort(d){ const x=new Date(d+"T12:00:00"); return x.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function fmt(eur){
  const neg=eur<-0.0001, a=Math.abs(eur);
  if(CUR==="IDR") return (neg?"−":"")+"Rp "+(Math.round(a*S.fx/100)*100).toLocaleString("en-US");
  return (neg?"−":"")+"€"+(Math.round(a*100)/100).toFixed(2).replace(/\.00$/,"");
}
function idr(n){ return "Rp "+Math.round(n).toLocaleString("en-US"); }
function pct(n){ return (n>=0?"+":"−")+Math.abs(n).toFixed(1)+"%"; }

/* ---- prices ---- */
function level(inst){
  if(inst==="basket"){
    const v=COMPANIES.map(c=>{const s=S.prices.basket[c];
      return (s.px&&s.base)? s.px/s.base*100 : 100;});
    return v.reduce((a,b)=>a+b,0)/v.length;
  }
  const s=S.prices[inst];
  return s.px||null;
}
function levelPct(inst){
  if(inst==="basket") return level("basket");
  const s=S.prices[inst];
  return (s.px&&s.base)? s.px/s.base*100 : null;
}
function tradable(inst){ return inst==="basket" || level(inst)>0; }

function csvRows(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(f); f=""; }
    else if(ch==="\n"){ row.push(f); f=""; rows.push(row); row=[]; }
    else if(ch!=="\r") f+=ch;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows;
}
/* tolerates 1.234,56 and 1,234.56 and 1234.56 */
function num(x){
  let t=String(x).trim().replace(/[^0-9.,\-]/g,"");
  if(!t) return NaN;
  const lc=t.lastIndexOf(","), ld=t.lastIndexOf(".");
  if(lc>-1&&ld>-1) t = lc>ld ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,"");
  else if(lc>-1){ const p=t.split(","); t = (p.length===2&&p[1].length!==3)? t.replace(",",".") : t.replace(/,/g,""); }
  return parseFloat(t);
}
function sheetUrls(raw){
  const u=(raw||"").trim(); if(!u) return [];
  if(/output=csv/.test(u)) return [u];
  const m=u.match(/\/d\/(?:e\/)?([A-Za-z0-9_-]{20,})/);
  if(!m) return [u];
  const id=m[1];
  return ["https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:csv",
          "https://docs.google.com/spreadsheets/d/e/"+id+"/pub?output=csv"];
}
function fetchT(url,ms){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),ms||9000);
  return fetch(url,{cache:"no-store",signal:ctl.signal}).finally(()=>clearTimeout(t));
}
async function fetchPrices(silent){
  const log=[]; let map=null, ok=false;
  S.feed.tried=new Date().toISOString();
  for(const url of sheetUrls(S.feed.sheet)){
    try{
      const r=await fetchT(url);
      if(!r.ok) throw new Error(r.status);
      const rows=csvRows(await r.text()); const m={};
      for(const row of rows){
        if(row.length<2) continue;
        const k=String(row[0]).trim().toLowerCase(), v=num(row[1]);
        if(k && isFinite(v) && v>0) m[k]=v;
      }
      if(Object.keys(m).length){ map=m; break; }
    }catch(e){ /* try the next url shape */ }
  }
  if(!S.feed.sheet) log.push("No sheet linked.");
  else if(!map) log.push("Sheet ✗ — not reachable or not shared.");
  else{
    let n=0;
    if(map.euridr){ setFx(map.euridr); log.push("Exchange rate ✓ €1 = "+idr(S.fx)); }
    if(map.btc){ setPx(S.prices.btc,map.btc); n++; }
    if(map.etf){ setPx(S.prices.etf,map.etf); n++; }
    const miss=[];
    for(const c of COMPANIES){
      const v=map[c.toLowerCase()];
      if(v){ setPx(S.prices.basket[c],v); n++; } else miss.push(c);
    }
    if(n) ok=true;
    log.push("Sheet ✓ "+n+" prices taken"+(miss.length?" — missing: "+miss.join(", "):""));
  }
  if(!map || !map.btc){
    try{
      const r=await fetchT("https://api.coinbase.com/v2/prices/BTC-EUR/spot");
      const j=await r.json(); const p=Number(j&&j.data&&j.data.amount);
      if(p>0){ setPx(S.prices.btc,p); ok=true; log.push("Bitcoin ✓ €"+Math.round(p).toLocaleString("en-US")+" (Coinbase)"); }
      else log.push("Bitcoin ✗");
    }catch(e){ log.push("Bitcoin ✗ — old price kept"); }
  }
  if(!map || !map.euridr){
    try{
      const r=await fetchT("https://api.frankfurter.app/latest?from=EUR&to=IDR");
      const j=await r.json();
      if(j&&j.rates&&j.rates.IDR){ setFx(j.rates.IDR); ok=true; log.push("Exchange rate ✓ €1 = "+idr(S.fx)+" (ECB)"); }
      else log.push("Exchange rate ✗ — old rate kept");
    }catch(e){ log.push("Exchange rate ✗ — old rate kept"); }
  }
  if(ok) S.feed.updated=new Date().toISOString();
  S.feed.log=log.join("\n");
  save();
  if(!silent || !typing()) render();
  return ok;
}

/* Prices refresh themselves in the background, never on the critical path: the
   first paint has already happened, failures are silent, old prices stay put. */
function autoRefresh(){
  if(S.feed.auto===false) return;
  if(navigator.onLine===false) return;
  const now=Date.now();
  const upd=S.feed.updated? new Date(S.feed.updated).getTime():0;
  const tri=S.feed.tried? new Date(S.feed.tried).getTime():0;
  if(now-upd < AUTO_MS) return;
  if(now-tri < RETRY_MS) return;
  Promise.resolve().then(()=>fetchPrices(true)).catch(()=>{});
}

/* ---- engine ---- */
function weekStats(k){
  const kid=K(k), out=[], m0=monday(new Date(kid.start+"T12:00:00")), nowWi=weekIndex(k,today());
  let rank=0;
  for(let i=0;i<kid.weeks;i++){
    const ws=addD(m0,i*7);
    let n=0, nb=0;
    for(let d=0;d<7;d++){
      const m=kid.days[iso(addD(ws,d))]||0;
      if(m>=kid.minutes) n++;
      if(kid.bonusMinutes && m>=kid.bonusMinutes) nb++;
    }
    const done=n>=kid.minDays;
    const bonus = kid.bonusMinutes? nb>=kid.bonusDays : false;
    if(done) rank++;
    out.push({i,start:ws,days:n,bonusDays:nb,done,bonus,past:i<nowWi,current:i===nowWi,
      rate:done?(RATES[k][rank-1]||0):0, rank:done?rank:null});
  }
  return {weeks:out, qualified:rank, nowWi};
}
function wordFull(kid){ return kid.wordRate? Math.round(kid.wordCap/kid.wordRate) : 0; }
function wordEditable(k,i){
  const nowWi=weekIndex(k,today());
  return i===nowWi || i===nowWi-1;
}
function calc(k){
  const kid=K(k), ws=weekStats(k);
  const weekEur=ws.weeks.reduce((s,w)=>s+w.rate,0);
  const bonusEur=ws.weeks.reduce((s,w)=>s+(w.bonus?kid.bonusEur:0),0);
  let remain=0, remainB=0;
  for(const w of ws.weeks){ if(!w.past||w.current){ if(!w.done) remain++; if(!w.bonus) remainB++; } }
  let futureWeek=0;
  for(let j=0;j<remain;j++) futureWeek+=RATES[k][ws.qualified+j]||0;
  const bonusLeft=remainB*kid.bonusEur;

  const bookEur=kid.books.reduce((s,b,i)=>s+(BOOKS[k][i]||0),0);
  const bookLeft=BOOKS[k].slice(kid.books.length).reduce((a,b)=>a+b,0);
  let wordEur=0, wordLeft=0, wordWeeks=0;
  if(kid.wordRate){
    for(const w of ws.weeks){
      const got=Math.min((kid.words["w"+w.i]||0)*kid.wordRate, kid.wordCap);
      wordEur+=got;
      if(got>=kid.wordCap-0.001) wordWeeks++;
      if(!w.past||w.current) wordLeft+=kid.wordCap-got;
    }
  }
  const msEur=kid.milestones.filter(m=>m.done).reduce((s,m)=>s+m.eur,0);
  const msLeft=kid.milestones.filter(m=>!m.done).reduce((s,m)=>s+m.eur,0);

  const earned=weekEur+bonusEur+bookEur+wordEur+msEur;
  const open=futureWeek+bonusLeft+bookLeft+wordLeft+msLeft;

  const st=new Date(kid.start+"T12:00:00"), t=today();
  let periods=0;
  if(t>=st) periods = kid.allowanceEvery==="week"? Math.floor((t-st)/(7*DAY))+1
    : (t.getFullYear()-st.getFullYear())*12+(t.getMonth()-st.getMonth())+1;
  const allowance=Math.max(0,periods)*kid.allowance;
  const spent=kid.spend.reduce((s,x)=>s+x.eur,0);
  const extraEur=(kid.extras||[]).reduce((s,x)=>s+x.eur,0);
  const paidOut=kid.payouts.reduce((s,x)=>s+x.eur,0);
  const inv=invested(k);
  /* every euro ever invested has left the balance (principalAll); a sale brings
     back proceeds. Subtracting only the open principal would hand back the
     stake for free on every sale. */
  const cash=earned+allowance+extraEur+inv.matchPaid+inv.proceeds-spent-inv.principalAll-paidOut;
  return {ws,weekEur,bonusEur,bonusLeft,futureWeek,bookEur,bookLeft,wordEur,wordLeft,wordWeeks,
    msEur,msLeft,earned,open,allowance,extraEur,spent,paidOut,cash,remain,inv};
}
function invested(k){
  const kid=K(k), t=Date.now();
  let principalOpen=0,principalAll=0,value=0,matchPaid=0,matchOpen=0,proceeds=0; const open=[],sold=[];
  for(const d of kid.deposits){
    const vested = t-new Date(d.date+"T12:00:00").getTime() >= 365*DAY;
    principalAll+=d.eur;
    if(d.sold){
      proceeds+=d.soldValue||0;
      if(d.matchClaimed) matchPaid+=d.eur*0.5;
      sold.push(d);
      continue;
    }
    const now=level(d.instrument)||d.px;
    const val=d.eur*(now/d.px);
    principalOpen+=d.eur; value+=val;
    if(vested) matchPaid+=d.eur*0.5; else matchOpen+=d.eur*0.5;
    open.push(Object.assign({},d,{value:val,vested,
      daysLeft:Math.max(0,Math.ceil((new Date(d.date+"T12:00:00").getTime()+365*DAY-t)/DAY))}));
  }
  return {principalOpen,principalAll,value,matchPaid,matchOpen,proceeds,open,sold};
}

  const diff=Math.round((today()-new Date(key+"T12:00:00"))/DAY);

function cycleDay(key){
  if(!editableDay(key)) return;
  const kid=K(), cur=kid.days[key]||0;

  else if(kid.bonusMinutes && cur<kid.bonusMinutes) next=kid.bonusMinutes;
  else next=0;
  if(next) kid.days[key]=next; else delete kid.days[key];
  save(); render();

/* ---- actions ---- */
function kid_(v,f){ K()[f]=v; save(); render(); }
function logDay(min){
  const k=iso(today()), kid=K();
  if((kid.days[k]||0)===min) delete kid.days[k]; else kid.days[k]=min;
  save(); render();
}
function toggleMs(id){ const m=K().milestones.find(x=>x.id===id); m.done=m.done?null:iso(today()); save(); render(); }
function toggleWordWeek(i){
  const kid=K();
  if(!kid.wordRate || !wordEditable(KID,i)) return;
  const key="w"+i, full=wordFull(kid);
  if((kid.words[key]||0)>=full) delete kid.words[key]; else kid.words[key]=full;
  save(); render();
}
async function runFeed(btn){ btn.disabled=true; btn.textContent="fetching…"; await fetchPrices(false); }
async function testSheet(btn){
  const t=btn.textContent; btn.disabled=true; btn.textContent="testing…";
  let ok=false;
  for(const url of sheetUrls(S.feed.sheet)){
    try{ const r=await fetchT(url,8000); if(r.ok){ const txt=await r.text(); if(csvRows(txt).length>1){ ok=true; break; } } }catch(e){}
  }
  btn.disabled=false; btn.textContent=t;
  alert(ok? "The sheet is reachable." :
    "The sheet could not be read. Check that it is shared with “Anyone with the link — Viewer”, or use File → Share → Publish to the web → CSV and paste that link instead.");
}
function resetBase(){
  if(!confirm("Set all start values to today's prices? The percentage display starts again at 0.")) return;
  for(const k of ["btc","etf"]) if(S.prices[k].px) S.prices[k].base=S.prices[k].px;
  for(const c of COMPANIES){ const s=S.prices.basket[c]; if(s.px) s.base=s.px; }
  save(); render();
}
function form(title,fields,onOk,note){
  dlgBody.innerHTML='<h3>'+title+'</h3>'+(note?'<p class="sub">'+note+'</p>':'')+fields.map(f=>{
    if(f.type==="select") return '<label>'+f.label+'</label><select id="f_'+f.id+'">'+
      f.options.map(o=>'<option value="'+esc(o[0])+'"'+(f.value===o[0]?" selected":"")+'>'+esc(o[1])+'</option>').join("")+'</select>';
    return '<label>'+f.label+'</label><input id="f_'+f.id+'" type="'+(f.type||"text")+'" '+
      (f.step?'step="'+f.step+'"':'')+' value="'+esc(f.value!==undefined?f.value:"")+'" '+
      (f.type==="number"?'inputmode="decimal"':'')+'>';
  }).join("")+
    '<div class="dlgbtns"><button class="btn ghost" onclick="dlg.close()">Cancel</button>'+
    '<button class="btn" id="okBtn">Save</button></div>';
  dlg.showModal();
  okBtn.onclick=()=>{
    const v={}; fields.forEach(f=>{const el=document.getElementById("f_"+f.id);
      v[f.id+"_raw"]=el.value;
      v[f.id]= f.type==="number"? Number(String(el.value).replace(",","."))||0 : el.value;});
    if(onOk(v)!==false){ dlg.close(); save(); render(); }
  };
}
function moneyFrom(v){
  /* returns {eur, idr, fx} or null; rupiah amounts are whole numbers and are
     frozen at today's rate so a later rate change never rewrites history */
  if(v.cur==="IDR"){
    const raw=Math.round(Number(String(v.amt_raw).replace(/[^0-9]/g,""))||0);
    if(raw<=0) return null;
    const eur=Math.round(raw/S.fx*100)/100;
    if(eur<=0) return null;
    return {eur:eur, idr:raw, fx:S.fx};
  }
  const eur=Math.round(v.amt*100)/100;
  if(eur<=0) return null;
  return {eur:eur};
}
function addSpend(){
  form("Add a purchase",[
    {id:"label",label:"What did you buy?"},
    {id:"cur",label:"Paid in",type:"select",value:"EUR",options:[["EUR","Euro (€)"],["IDR","Rupiah (Rp)"]]},
    {id:"amt",label:"How much?",type:"number",step:"0.01"}
  ],v=>{
    const m=moneyFrom(v);
    if(!m){ alert("Please enter an amount."); return false; }
    K().spend.push(Object.assign({date:iso(today()),label:v.label||"Purchase"},m));
  },"Rupiah is converted at today\u2019s rate, €1 = "+idr(S.fx)+", and keeps that rate.");
}
function addExtra(){
  form("Extra money",[
    {id:"label",label:"Where is it from?",value:"Gift"},
    {id:"cur",label:"Given in",type:"select",value:"EUR",options:[["EUR","Euro (€)"],["IDR","Rupiah (Rp)"]]},
    {id:"amt",label:"How much?",type:"number",step:"0.01"}
  ],v=>{
    const m=moneyFrom(v);
    if(!m){ alert("Please enter an amount."); return false; }
    const kid=K();
    if(!Array.isArray(kid.extras)) kid.extras=[];
    kid.extras.push(Object.assign({date:iso(today()),label:v.label||"Extra money"},m));
  },"Birthday money, a gift from Oma, anything that is neither pocket money nor from the challenge.");
}
function addPayout(){ form("Book a payout",[{id:"eur",label:"Amount (€)",type:"number",step:"0.01"},{id:"note",label:"Note"}],
  v=>{ if(v.eur<=0) return false; K().payouts.push({date:iso(today()),eur:v.eur,note:v.note}); }); }
function addBook(){
  const kid=K();
  if(kid.books.length>=BOOKS[KID].length){ alert("All books are already ticked off."); return; }
  form("Tick off a book",[{id:"title",label:"Title"}],v=>{ kid.books.push({title:v.title||"Book",date:iso(today())}); });
}
function addWords(){
  const wk="w"+weekIndex(KID,today());
  form("New words this week",[{id:"n",label:"How many",type:"number",value:K().words[wk]||0}],
    v=>{ K().words[wk]=Math.max(0,Math.round(v.n)); });
}
function addDeposit(){
  const c=calc(KID), lv=level(BUY);
  if(!lv){ alert("There is no price for the "+INSTR[BUY].name+" yet. Papa has to fetch it first."); return; }
  form("Invest in the "+INSTR[BUY].name,[{id:"eur",label:"How much? You have "+fmt(c.cash),type:"number",step:"0.5"}],v=>{
    if(v.eur<=0) return false;
    if(v.eur>c.cash+0.001){ alert("You do not have that much."); return false; }
    K().deposits.push({id:"d"+Date.now(),date:iso(today()),instrument:BUY,eur:v.eur,px:lv});
  },"A one-year clock starts today for this money. "+INSTR[BUY].care);
}
function sellDeposit(id){
  const kid=K(), d=kid.deposits.find(x=>String(x.id)===String(id));
  if(!d||d.sold) return;
  const now=level(d.instrument)||d.px, val=d.eur*(now/d.px);
  const vested = Date.now()-new Date(d.date+"T12:00:00").getTime() >= 365*DAY;
  const daysLeft=Math.max(0,Math.ceil((new Date(d.date+"T12:00:00").getTime()+365*DAY-Date.now())/DAY));
  const gain=val-d.eur;
  dlgBody.innerHTML='<h3>Sell '+INSTR[d.instrument].name+'?</h3>'+
    '<p>You put in <b>'+fmt(d.eur)+'</b> on '+dshort(d.date)+'. Today it is worth <b>'+fmt(val)+'</b> '+
    '('+(gain>=0?"up ":"down ")+fmt(Math.abs(gain))+').</p>'+
    (vested
      ? '<p>The year is over, so you <b>keep the '+fmt(d.eur*0.5)+' bonus</b>. Selling moves '+
        fmt(val)+' back into your balance.</p>'
      : '<div class="warnbox">There are still <b>'+daysLeft+' days</b> to go. If you sell now you '+
        '<b>give up the '+fmt(d.eur*0.5)+' bonus</b> for this money, and it does not come back if you buy again later.</div>')+
    '<div class="dlgbtns"><button class="btn ghost" onclick="dlg.close()">Keep it</button>'+
    '<button class="btn" onclick="doSell('+JSON.stringify(String(id))+')">Sell for '+fmt(val)+'</button></div>';
  if(!dlg.open) dlg.showModal();
}
function doSell(id){
  const kid=K(), d=kid.deposits.find(x=>String(x.id)===String(id));
  if(!d||d.sold){ dlg.close(); return; }
  const now=level(d.instrument)||d.px, val=d.eur*(now/d.px);
  const vested = Date.now()-new Date(d.date+"T12:00:00").getTime() >= 365*DAY;
  d.sold=true;
  d.soldValue=Math.round(val*100)/100;
  d.soldDate=iso(today());
  d.soldPx=now;
  d.matchClaimed=vested;
  dlg.close(); save(); render();
}

function explainSaving(){
  dlgBody.innerHTML='<h3>How saving works</h3>'+
   '<p>Money you leave in your balance stays exactly the same size. Money you invest can grow, and it can shrink.</p>'+
   '<h4>The bonus</h4>'+
   '<p>Leave money invested for <b>one whole year</b> and Papa adds <b>50% of what you put in</b>. '+
   'Every time you invest, that money gets its own one-year clock.</p>'+
   '<p>Put in €20 today. In a year the €20 is still yours, plus <b>€10</b> from Papa, plus whatever the price did in the meantime.</p>'+
   '<h4>Why this is a good deal</h4>'+
   '<p>Almost nothing in the world pays you 50% for waiting a year. And the bonus is counted on what you '+
   '<b>put in</b>, not on what it is worth later, so even if the price falls the bonus stays the same size.</p>'+
   '<h4>Why it is still risky</h4>'+
   '<p>Prices move up and down every day and nobody knows which way. Here is €20 after one year:</p>'+
   '<table><tr><td>price up a fifth</td><td>€24 + €10 = €34</td></tr>'+
   '<tr><td>price does nothing</td><td>€20 + €10 = €30</td></tr>'+
   '<tr><td>price down a fifth</td><td>€16 + €10 = €26</td></tr>'+
   '<tr><td>price down a third</td><td>€13.33 + €10 = €23.33</td></tr>'+
   '<tr><td>price down by half</td><td>€10 + €10 = €20</td></tr></table>'+
   '<p>The bonus works like a cushion. As long as the price does not fall by more than a third, you still '+
   'end up ahead of the €20 you started with. If it falls by half you get your €20 back and nothing more. '+
   'If it falls further than that, you end up with less than you put in. That can happen.</p>'+
   '<h4>Selling early</h4>'+
   '<p>You can sell any time and the money goes straight back into your balance. But if you sell before the '+
   'year is up, <b>the bonus is gone</b> — and the cushion goes with it. Then a price that has fallen is simply a loss.</p>'+
   '<h4>A good rule</h4>'+
   '<p>Only invest money you do not need soon. If you are saving for something you want to buy in a few weeks, '+
   'leave it in your balance where it cannot shrink.</p>'+
   '<div class="dlgbtns"><button class="btn" onclick="dlg.close()">Got it</button></div>';
  if(!dlg.open) dlg.showModal();
}
function exportJSON(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="challenges-"+iso(today())+".json"; a.click();
}
function importJSON(){
  const i=document.createElement("input"); i.type="file"; i.accept="application/json";
  i.onchange=()=>{ const r=new FileReader(); r.onload=()=>{
    try{
      const keep=S.feed.sheet;
      S=JSON.parse(r.result);
      if(!S.feed) S.feed={sheet:"",updated:null,tried:null,log:"",auto:true};
      if(!S.feed.sheet && keep) S.feed.sheet=keep;
      for(const k of ["juna","artus"]) if(S.kids&&S.kids[k]&&!Array.isArray(S.kids[k].extras)) S.kids[k].extras=[];
      save(); render(); alert("Backup loaded.");
    }
    catch(e){ alert("That file could not be read."); } }; r.readAsText(i.files[0]); };
  i.click();
}
